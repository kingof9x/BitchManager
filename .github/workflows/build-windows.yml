name: Build Windows Executable (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe (x64 Installer & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Ensure Electron Entry File Exists
        shell: bash
        run: |
          mkdir -p electron
          if [ ! -f electron/main.cjs ]; then
            cat << 'EOF' > electron/main.cjs
const { app, BrowserWindow, Menu } = require('electron');
const path = require('path');

function createWindow() {
  const win = new BrowserWindow({
    width: 1600,
    height: 860,
    minWidth: 1024,
    minHeight: 680,
    title: 'BitchManager — Video Controller & LED Programming Studio',
    backgroundColor: '#040807',
    autoHideMenuBar: true,
    show: false,
    webPreferences: {
      nodeIntegration: false,
      contextIsolation: true,
      sandbox: true,
    },
  });

  Menu.setApplicationMenu(null);
  win.loadFile(path.join(__dirname, '../dist/index.html'));

  win.once('ready-to-show', () => {
    win.show();
  });
}

app.whenReady().then(() => {
  createWindow();

  app.on('activate', () => {
    if (BrowserWindow.getAllWindows().length === 0) {
      createWindow();
    }
  });
});

app.on('window-all-closed', () => {
  if (process.platform !== 'darwin') {
    app.quit();
  }
});
EOF
          fi

      - name: Install Electron & Electron-Builder
        run: npm install --no-save electron@^33.2.1 electron-builder@^25.1.8

      - name: Package Windows .exe
        run: npx electron-builder --win nsis portable --x64 -c.directories.output=dist_electron -c.directories.app=. -c.extraMetadata.main=electron/main.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List Generated Executables
        shell: bash
        run: |
          echo "Generated Windows binaries in dist_electron:"
          ls -la dist_electron/*.exe || true

      - name: Upload Windows Executables to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BitchManager-Windows-x64
          path: |
            dist_electron/*.exe
            dist_electron/*.blockmap
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_electron/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

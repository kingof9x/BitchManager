name: Windows build

on:
  push:
    branches: [main, "claude/**"]
    paths: ["windows/**", ".github/workflows/windows-build.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file exe
        run: dotnet publish windows/BitchManager/BitchManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: BitchManager-win-x64
          path: publish/BitchManager.exe
